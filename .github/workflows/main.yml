name: Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "windows/**"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Show toolchain
        shell: pwsh
        run: |
          dotnet --info
          dotnet --list-sdks

      - name: Cache FFmpeg download
        uses: actions/cache@v4
        with:
          path: windows/build/ffmpeg-cache
          key: ffmpeg-n8.1-${{ matrix.arch }}

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer (${{ matrix.arch }})
        shell: pwsh
        env:
          WINDOWS_SIGN_CERT_BASE64: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}
          WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        run: ./windows/scripts/build-installer.ps1 -Architecture ${{ matrix.arch }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ClippySetup-${{ matrix.arch }}
          path: windows/build/ClippySetup-${{ matrix.arch }}.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable ZIP fallback
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Clippy-portable-${{ matrix.arch }}
          path: windows/build/Clippy-win-${{ matrix.arch }}.zip
          if-no-files-found: ignore
          retention-days: 30

      - name: Job summary
        if: success()
        shell: pwsh
        run: |
          $setup = Get-Item "windows/build/ClippySetup-${{ matrix.arch }}.exe"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value @"
          ## Clippy Windows installer (${{ matrix.arch }})

          - **File:** ClippySetup-${{ matrix.arch }}.exe
          - **Size:** $([math]::Round($setup.Length / 1MB, 2)) MB

          Download it from this run under **Artifacts** -> **ClippySetup-${{ matrix.arch }}**.
          "@
